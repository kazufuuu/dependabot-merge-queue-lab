# 版は範囲で書き、範囲の中に収まる更新ではロックファイルだけが変わるようにする。
# グループは semver の種別で分ける。patch のグループだけが自動マージの対象になる。
# major はグループに入れず、依存ごとに 1 本ずつ出す。
# セキュリティ更新はグループに入れない。待機もかからず、依存ごとにすぐ出る。
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        update-types: [minor]

  - package-ecosystem: uv
    directory: /api
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        update-types: [minor]

  - package-ecosystem: npm
    directory: /web
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        update-types: [minor]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]

  # ランタイムと道具の版は Dockerfile の FROM で決める。
  # 同じイメージを全部の Dockerfile で一度に上げるため、ディレクトリをまとめる。
  - package-ecosystem: docker
    directories:
      - /
      - /api
      - /web
      - /tools/terraform
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]
    ignore:
      # ランタイムの minor と major は、対応する版のファイルと合わせて人が上げる。
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]
