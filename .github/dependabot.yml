# バージョンは範囲で書き、範囲の中に収まる更新ではロックファイルだけが変わるようにする。
# npm は versioning-strategy: increase-if-necessary でそうなる。
# uv ではこの値が効かないので、指定しない。pyproject.toml の [project] に description があり、
# その名前が PyPI に無いと、Dependabot はライブラリとみなして範囲を広げる方針を選ぶ。
# この方針では、範囲の中の更新は uv.lock だけが変わり、範囲を超える更新は pyproject.toml も変わる。
# PR にまとめるのは、バージョンが連動するライブラリ群だけにする（npm の vitest の群）。
# それ以外は、patch も minor も major も、依存ごとに 1 本ずつ出す。
# 注意: 更新の種類（patch、minor）でまとめるグループを作らない。種類のグループの PR が開いていると、
# Dependabot はそのディレクトリの全部の依存を処理済みとみなし、ほかの更新を出さなくなる。
# minor のグループの PR が人の判断を待っている間、patch の自動マージが止まった（実物で確かめた）。
# open-pull-requests-limit は、依存の数より大きくする。人の判断待ちの PR で埋まると、patch の PR も出なくなる。
# 例外は github-actions。人が判断するので、patch、minor、major を 1 本にまとめる。
# セキュリティアップデートはグループに入れない。cooldown もかからず、依存ごとにすぐ出る。
# 自動マージの条件は .github/scripts/dependabot_merge.py にある。所有者のレビューの決まりは .github/repo-settings/ にある。
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /web
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      # vitest と、その部品（@vitest/...）は、同じバージョンで一緒に上げる。バージョンが食い違うと動かない。
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps

  # Python と Node のランタイム、Terraform 本体のバージョンの管理場所は、.python-version、.node-version、infra/versions.tf にある。
  # Dependabot はそこを書き換えられない。
  # Dependabot 用の dependabot/Dockerfile を上げさせ、version-sync の workflow が .python-version などへ写す。
  # cooldown は Docker Hub のイメージにしか効かないので、Dependabot 用の Dockerfile には Docker Hub のイメージを書く。
  # uv は、ここには置かない。直下の uv の設定が、ライブラリと同じく、pyproject.toml の開発用の依存として上げる。
  - package-ecosystem: docker
    directory: /dependabot
    # コンテナイメージには、Dependabot のセキュリティアップデートが無い。ここでは通常の更新だけを、cooldown のあとに出す。
    # Python と Node のセキュリティアップデートは、security-release の workflow が待たずに出す。
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    ignore:
      # 互換性が変わる大きい更新は、人が時期を決めて上げる。PR を出さない。
      # Python は patch だけを出す。minor（3.13 から 3.14）は、requires-python や依存の対応が要る。
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Node は同じ major の中を出す。Node は、セキュリティアップデートも含めて、いちばん新しい minor にしか出さない。
      # patch だけに絞ると、何も届かなくなる。
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Terraform は、patch、minor、major のどれも出す。

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    # action の更新は、patch、minor、major を 1 本の PR にまとめる。人が判断する。
    # action を上げると、workflow のファイルとロックファイルの両方が変わるので、自動マージの対象にしない。
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  # ===== 試し用（digest の調査）。本番の仕組みではない。確認が済んだら、この下の 3 つの設定と trial-digest/ を消す。 =====
  # trial-python: 複数ディレクトリの python の FROM を 1 本の PR にまとめられるか（obs e）。
  # app-a は同じ python の FROM が 2 行（obs d）。現在の digest を書いてあるので、提案できるのはバージョンの更新だけ（obs 4）。
  - package-ecosystem: docker
    directories:
      - /trial-digest/app-a
      - /trial-digest/app-b
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: trial
    groups:
      trial-python:
        patterns: ["python"]

  # trial-node-digest: 最新のタグ（24.22.3-slim）に、合わない digest を書いてある。
  # 提案できるのは、同じタグの digest の付け替えだけ（obs 1）。cooldown は置かない。
  - package-ecosystem: docker
    directory: /trial-digest/nodeapp
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: trial

  # trial-node-version: 1 つ古いタグ（24.22.2-slim）。新しい 24.22.3 は 7 日より内なので、cooldown で待たされるはず（obs b）。
  - package-ecosystem: docker
    directory: /trial-digest/nodeapp2
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: trial
  # ===== 試し用ここまで =====
