# 版は範囲で書き、範囲の中に収まる更新ではロックファイルだけが変わるようにする。
# npm は versioning-strategy: increase-if-necessary でそうなる。
# uv ではこの値が効かないので、指定しない。pyproject.toml の [project] に description があり、
# その名前が PyPI に無いと、Dependabot はライブラリとみなして範囲を広げる方針を選ぶ。
# この方針では、範囲の中の更新は uv.lock だけが変わり、範囲を超える更新は pyproject.toml も変わる。
# グループは semver の種別で分ける。patch のグループだけが自動マージの対象になる。
# major はグループに入れず、依存ごとに 1 本ずつ出す。
# セキュリティ更新はグループに入れない。待機もかからず、依存ごとにすぐ出る。
# 自動マージの条件は automation/dependabot_merge.py にある。
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor]

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor]

  - package-ecosystem: npm
    directory: /web
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      dev-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]

  # ランタイムと道具の版の正本は、pyproject.toml などにある。Dependabot はそこを書き換えられない。
  # 見張り役の versions/Dockerfile を上げさせ、version-sync の workflow が正本へ写す。
  # 待機（cooldown）は Docker Hub のイメージにしか効かないので、見張り役には Docker Hub のイメージを書く。
  - package-ecosystem: docker
    directory: /versions
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]
    ignore:
      # ランタイムの minor と major は、互換性の確認が要るので、人が上げる。
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees: [kazufusa]
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: [patch]
      minor:
        applies-to: version-updates
        update-types: [minor]
