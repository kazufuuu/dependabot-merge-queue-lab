name: dependabot-stats

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: 集計する日数
        default: "7"

permissions:
  contents: read
  pull-requests: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Dependabot の PR を数える
        shell: bash  # pipefail を効かせ、python が失敗したら step も失敗させる（tee が 0 を返すため）
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '7' }}
        run: python3 .github/scripts/dependabot_stats.py --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
