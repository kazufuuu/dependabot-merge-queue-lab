name: security-release

# Python と Node のセキュリティの修正を含む版を見つけ、待たずに PR を出す。
# 通常の更新は Dependabot が、待つ期間のあとに出す。スクリプトは常に main の版で動かす。
on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release
  cancel-in-progress: false

jobs:
  # 鍵を持たない。公開されている情報を読み、上げる版を決める。
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      payload: ${{ steps.find.outputs.payload }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: セキュリティの修正を含む版を探す
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/security_release.py find

  # 鍵を持つ。渡された版で main のファイルを書き換え、ブランチと PR を作る。
  open:
    needs: find
    if: needs.find.outputs.payload != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automerge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: App のトークンで PR を出す
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ needs.find.outputs.payload }}
          AUTOMERGE_APP_ID: ${{ vars.AUTOMERGE_APP_ID }}
          AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
        run: python3 automation/security_release.py open
