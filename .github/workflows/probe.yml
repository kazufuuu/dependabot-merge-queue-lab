# 規則の効き方を、App のトークンで直接確かめるための一時的な workflow。確かめ終えたら消す。
name: probe
on:
  workflow_dispatch:
    inputs:
      script:
        description: App のトークンで動かすコマンド
        required: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    environment: automerge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: App のトークンでコマンドを動かす
        env:
          AUTOMERGE_APP_ID: ${{ vars.AUTOMERGE_APP_ID }}
          AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          SCRIPT: ${{ inputs.script }}
        run: |
          GH_TOKEN="$(python3 - <<'PY' | tail -n 1
          import os, sys
          sys.path.insert(0, "automation")
          from dependabot_merge import app_token
          print(app_token(os.environ["GITHUB_REPOSITORY"], os.environ["AUTOMERGE_APP_ID"], os.environ["AUTOMERGE_APP_PRIVATE_KEY"]))
          PY
          )"
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN GH_REPO="$GITHUB_REPOSITORY"
          unset AUTOMERGE_APP_PRIVATE_KEY
          set +e
          bash -x -c "$SCRIPT"
          echo "exit=$?"
