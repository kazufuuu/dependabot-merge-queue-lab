name: dependabot-merge

# 判定は常に main の版で動かす。PR の中身は checkout しない。
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dependabot の PR を振り分ける
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_DEV_MINOR: ${{ vars.AUTOMERGE_DEV_MINOR }}
        run: python3 automation/dependabot_merge.py
