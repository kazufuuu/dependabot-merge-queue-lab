name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# テストは runner の上で直接動かす。版は正本から読む。
# - Python: .python-version（uv が読む）
# - uv と Node: .tool-versions（uv は automation/versions.py が読んで渡す。Node は setup-node が読む）
# - Terraform: infra/versions.tf（automation/versions.py が読んで渡す）
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 版を正本から読む
        id: versions
        run: python3 automation/versions.py show >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.versions.outputs.uv }}
          enable-cache: true
          cache-python: true
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 版を正本から読む
        id: versions
        working-directory: .
        run: python3 automation/versions.py show >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          version: ${{ steps.versions.outputs.uv }}
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Terraform の版を正本から読む
        id: versions
        working-directory: .
        run: python3 automation/versions.py show >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test

  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 振り分けと版の同期のテスト
        run: python3 -m unittest discover -s automation -v
      - name: 版の正本と見張り役が揃っていることを確かめる
        run: python3 automation/versions.py check

  # 本番のイメージが組み立てられることを確かめる。起動の確認とテストは、ここでは行わない。
  # runner にはコンパイラがあるが、slim のイメージには無い。テストが通っても、組み立てが落ちる更新がある。
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/buildcache
          key: image-${{ hashFiles('api/Dockerfile', 'api/pyproject.toml', 'api/uv.lock', 'pyproject.toml') }}
          restore-keys: image-
      - name: API のイメージを正本の版で組み立てる
        run: |
          docker buildx create --name ci --use >/dev/null
          scripts/build-api.sh --builder ci \
            --cache-from type=local,src=/tmp/buildcache \
            --cache-to type=local,dest=/tmp/buildcache-new,mode=max
          rm -rf /tmp/buildcache && mv /tmp/buildcache-new /tmp/buildcache

  # 必須の検査はこの 1 つだけにする。テストとイメージの組み立てが、すべて成功したときだけ成功する。
  all-green:
    if: always()
    needs: [workspace, api, web, infra, automation, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: すべての検査の結果を確かめる
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
