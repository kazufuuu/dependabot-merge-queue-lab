name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# テストは runner の上で直接動かす。版は正本から読む。
# - Python: .python-version（uv が読む）
# - uv: pyproject.toml の開発用の依存 uv==（setup-uv が uv.lock から読む）
# - Node: web/.node-version（setup-node が読む）
# - Terraform: infra/versions.tf（automation/versions.py が読んで渡す）
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: uv.lock
          enable-cache: true
          cache-python: true
      - name: uv の版が正本と同じことを確かめる
        run: test "$(uv --version | cut -d' ' -f2)" = "$(python3 automation/versions.py show | sed -n 's/^uv=//p')"
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
          version-file: ${{ github.workspace }}/uv.lock
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Terraform の版を正本から読む
        id: versions
        working-directory: .
        run: python3 automation/versions.py show >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test

  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 振り分けと版の同期のテスト
        run: python3 -m unittest discover -s automation -v
      - name: 版の正本と見張り役が揃っていることを確かめる
        run: python3 automation/versions.py check

  # 本番のイメージが組み立てられることと、起動することを確かめる。テストはここでは動かさない。
  # runner にはコンパイラがあるが、slim のイメージには無い。テストが通っても、組み立てが落ちる更新がある。
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/buildcache
          key: image-${{ hashFiles('api/Dockerfile', 'api/pyproject.toml', 'api/uv.lock', 'pyproject.toml') }}
          restore-keys: image-
      - name: API のイメージを正本の版で組み立てる
        run: |
          docker buildx create --name ci --use >/dev/null
          scripts/build-api.sh --builder ci --load -t api \
            --cache-from type=local,src=/tmp/buildcache \
            --cache-to type=local,dest=/tmp/buildcache-new,mode=max
          rm -rf /tmp/buildcache && mv /tmp/buildcache-new /tmp/buildcache
      - name: 組み立てたイメージを起動する
        run: docker run --rm api

  # 必須の検査はこの 1 つだけにする。テストとイメージの組み立てが、すべて成功したときだけ成功する。
  all-green:
    if: always()
    needs: [workspace, api, web, infra, automation, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: すべての検査の結果を確かめる
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
