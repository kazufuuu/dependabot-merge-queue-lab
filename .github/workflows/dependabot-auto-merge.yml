name: dependabot-auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TEAM: ${{ vars.REVIEW_TEAM }}
      REVIEWER: ${{ vars.REVIEWER }}
    steps:
      - name: Decide whether this PR is merged without a human
        id: decide
        if: github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]'
        run: |
          # Only version-update groups named "*-patch" qualify. Their branch ends with
          # "<group>-<10 hex>". Security updates are not grouped, so they never match.
          auto=false
          if [[ "$HEAD_REF" =~ ^dependabot/.+/[a-z0-9-]+-patch-[0-9a-f]{10}$ ]]; then
            files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
            others="$(echo "$files" | grep -vE '(^|/)(uv\.lock|package-lock\.json)$' || true)"
            if [ -z "$others" ]; then
              auto=true
            else
              echo "files other than lock files changed:"
              echo "$others"
            fi
          else
            echo "not an auto-merge group"
          fi
          echo "auto=$auto" | tee -a "$GITHUB_OUTPUT"
      - name: Approve, enable auto-merge and label
        if: steps.decide.outputs.auto == 'true'
        run: |
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD"
          gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD"
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=automerge"
      - name: Disable auto-merge and dismiss approval
        if: github.actor != 'dependabot[bot]'
        run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/automerge" || true
          for id in $(gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id'); do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="pushed by a non-Dependabot actor" -f event=DISMISS
          done
      - name: Request review from owners
        if: steps.decide.outputs.auto == 'false' || github.actor != 'dependabot[bot]'
        run: |
          # GITHUB_TOKEN cannot always resolve an organisation team; fall back to a person.
          if [ -n "$TEAM" ] && gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
              -f "team_reviewers[]=$TEAM" --silent; then
            echo "requested team $TEAM"
            exit 0
          fi
          test -n "$REVIEWER"
          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$REVIEWER" --silent
          echo "requested $REVIEWER"
