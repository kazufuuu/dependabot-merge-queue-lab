name: dependabot-review-request
# Review requests for PRs that are not auto-merged are sent by dependabot-auto-merge.
# This workflow covers auto-merge candidates that got stuck: the required check failed
# on the PR, or the PR was dropped from the merge queue.
on:
  workflow_run:
    workflows: [shared]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  on-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event.workflow_run.event }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      TEAM: ${{ vars.REVIEW_TEAM }}
      REVIEWER: ${{ vars.REVIEWER }}
    steps:
      - name: Request review for the failed PR
        run: |
          if [ "$EVENT" = merge_group ]; then
            # gh-readonly-queue/<base>/pr-<number>-<sha>
            pr="$(echo "$BRANCH" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
          else
            pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')"
          fi
          test -n "$pr"
          author="$(gh pr view "$pr" --repo "$REPO" --json author --jq '.author.login')"
          case "$author" in
            dependabot|app/dependabot) ;;
            *) echo "PR #$pr is by $author; nothing to do"; exit 0 ;;
          esac
          if [ -n "$TEAM" ] && gh api -X POST "repos/$REPO/pulls/$pr/requested_reviewers" \
              -f "team_reviewers[]=$TEAM" --silent; then
            echo "requested team $TEAM on #$pr"
            exit 0
          fi
          test -n "$REVIEWER"
          gh api -X POST "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$REVIEWER" --silent
          echo "requested $REVIEWER on #$pr"
