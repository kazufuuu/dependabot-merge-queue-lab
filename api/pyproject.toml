[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "phonenumbers>=9.0,<10",
    "pydantic>=2.13,<3",
    "jinja2>=3.1.6,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
