[project]
name = "api"
version = "0.1.0"
description = "連絡先を受け取り、SMS の文面を作る"
requires-python = "==3.13.16"
dependencies = [
    "phonenumbers>=9.0,<10",
    "pydantic>=2.13,<3",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[tool.uv]
required-version = ">=0.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
