[project]
name = "lab-notifier"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lab-contacts",
    "packaging>=25.0,<27",
]

[tool.uv.sources]
lab-contacts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
