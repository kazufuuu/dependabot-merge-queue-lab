[project]
name = "lab-workspace"
version = "0.0.0"
description = "連絡先を扱うライブラリのワークスペース"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["automation", "packages/*/src"]
